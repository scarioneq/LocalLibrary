{% extends "base_generic.html" %}

{% block content %}
<h1>{% if form.instance.pk %}Редактировать книгу{% else %}Добавить новую книгу{% endif %}</h1>

<form action="" method="post">
    {% csrf_token %}
    <table>
    {{ form.as_table }}
    </table>
    <input type="submit" value="Сохранить" class="btn btn-primary" />
    <a href="{% if form.instance.pk %}{% url 'book-detail' form.instance.pk %}{% else %}{% url 'books' %}{% endif %}" 
       class="btn btn-secondary">Отмена</a>
</form>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const genreSelect = document.getElementById('id_genre');
        if (genreSelect) {
            genreSelect.size = 6;
        }
    });
</script>
{% endblock %}
